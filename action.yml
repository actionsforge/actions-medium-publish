# action.yml
name: "Medium Publisher"
description: "Publishes articles to Medium from GitHub Actions"
author: "ActionsForge"

inputs:
  mediumToken:
    description: "Medium integration token"
    required: true
  title:
    description: "Title of the article (optional if provided in markdown frontmatter)"
    required: false
  content:
    description: "Markdown content or path to markdown file"
    required: true
  publishStatus:
    description: "Publishing status (draft, unlisted, or public)"
    required: false
    default: "draft"

outputs:
  postUrl:
    description: "URL of the published post"
  postId:
    description: "ID of the published post"

runs:
  using: "node20"
  main: "dist/index.js"
branding:
  icon: "upload-cloud"
  color: "blue"
